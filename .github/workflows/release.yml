name: Build & Release

# Builds installers + portable zips for Windows, macOS and Linux (x64 and arm64)
# and collects them into a draft GitHub release.
#
#   - Push a tag like "v0.1.0"            -> builds and creates/updates the draft release for that tag
#   - Run manually (Actions > Build & Release > Run workflow)
#                                           -> builds and drafts "v<package.json version>"

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (default: v<version from package.json>)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '22'
  # no signing certificates in CI: macOS builds are ad-hoc signed, Windows builds unsigned
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  test:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:prod

  build:
    name: ${{ matrix.name }} ${{ matrix.arch }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, platform: win,   arch: x64,   ffmpeg_arch: x64 }
          # ffmpeg-static has no Windows ARM64 build; the x64 binary runs under Windows on ARM emulation
          - { name: Windows, os: windows-latest, platform: win,   arch: arm64, ffmpeg_arch: x64 }
          - { name: macOS,   os: macos-latest,   platform: mac,   arch: x64,   ffmpeg_arch: x64 }
          - { name: macOS,   os: macos-latest,   platform: mac,   arch: arm64, ffmpeg_arch: arm64 }
          - { name: Linux,   os: ubuntu-latest,  platform: linux, arch: x64,   ffmpeg_arch: x64 }
          - { name: Linux,   os: ubuntu-latest,  platform: linux, arch: arm64, ffmpeg_arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: .cache
          key: electron-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Fetch ffmpeg for the target architecture
        env:
          npm_config_arch: ${{ matrix.ffmpeg_arch }}
        run: |
          rm -f node_modules/ffmpeg-static/ffmpeg node_modules/ffmpeg-static/ffmpeg.exe
          node node_modules/ffmpeg-static/install.js
          ls -la node_modules/ffmpeg-static

      - name: Build app
        run: npm run build:prod

      - name: Package installers and portable zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never

      - name: Collect artifacts
        run: |
          mkdir -p out
          shopt -s nullglob
          for f in release/*.exe release/*.zip release/*.dmg release/*.AppImage release/*.deb; do
            cp "$f" out/
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: celerity-${{ matrix.platform }}-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          elif [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "Release tag: $TAG"
          ls -la artifacts
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; uploading assets"
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* \
              --draft \
              --target "$GITHUB_SHA" \
              --title "Celerity $TAG" \
              --generate-notes
          fi
